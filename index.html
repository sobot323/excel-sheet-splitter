<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podziel plik Excel na arkusze</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172033;background:#f3f5f9}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px}
main{max-width:720px;margin:0 auto}
h1{font-size:28px;margin:0 0 10px}
p{color:#5d6879;line-height:1.5}
.panel{margin-top:24px;padding:24px;background:#fff;border:1px solid #e0e5ed;border-radius:14px;box-shadow:0 5px 22px #18243a0b}
.drop{padding:30px 18px;border:2px dashed #b8c4d6;border-radius:10px;text-align:center;background:#fafbfe}
.drop.over{border-color:#2458c6;background:#f0f5ff}
.file-label{display:inline-block;padding:11px 17px;background:#2458c6;color:#fff;border-radius:8px;font-weight:600;cursor:pointer}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hint{font-size:13px;color:#6b7585;margin-top:12px}
.field{margin-top:22px}
label.field-label{display:block;font-weight:600;margin-bottom:8px}
input[type=text]{width:100%;padding:12px;border:1px solid #cbd3df;border-radius:8px;font:inherit}
button{margin-top:22px;padding:12px 18px;border:0;border-radius:8px;background:#2458c6;color:white;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#status{margin-top:20px;font-size:14px;line-height:1.5}
ul{padding:0;margin:12px 0 0;list-style:none}
li{padding:9px 11px;margin-top:6px;border:1px solid #e6eaf0;border-radius:7px;display:flex;justify-content:space-between;gap:12px;font-size:13px}
.filename{color:#586477;text-align:right;overflow-wrap:anywhere}
@media(max-width:520px){body{padding:22px 12px}.panel{padding:17px}h1{font-size:24px}li{display:block}.filename{display:block;text-align:left;margin-top:4px}}
</style>
</head>
<body>
<main>
<h1>Podziel plik Excel na osobne arkusze</h1>
<p>Wybierz skoroszyt Excel. Każda zakładka zostanie zapisana jako osobny plik XLSX, a wszystkie pliki znajdą się w jednej paczce ZIP.</p>
<section class="panel">
<div class="drop" id="drop">
  <label class="file-label" for="file">Wybierz plik Excel</label>
  <input id="file" type="file" accept=".xlsx">
  <div class="hint" id="file-name">Możesz też przeciągnąć plik tutaj. Obsługiwany format: XLSX.</div>
</div>
<div class="field">
<label class="field-label" for="suffix">Tekst dodawany na końcu nazwy każdego pliku</label>
<input id="suffix" type="text" autocomplete="off">
<div class="hint">Przykład: Arkusz1_karta_pracy_11_2026.xlsx</div>
</div>
<div id="status" aria-live="polite">Nie wybrano pliku.</div>
<button id="run" disabled>Utwórz paczkę ZIP</button>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(() => {
  const fileInput = document.getElementById('file');
  const drop = document.getElementById('drop');
  const fileName = document.getElementById('file-name');
  const suffixInput = document.getElementById('suffix');
  const status = document.getElementById('status');
  const runButton = document.getElementById('run');
  let workbook = null;
  let sourceName = '';

  const date = new Date();
  suffixInput.value = '_karta_pracy_' +
    String(date.getMonth() + 1).padStart(2, '0') + '_' + date.getFullYear();

  function cleanName(value) {
    return String(value)
      .replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_')
      .replace(/[. ]+$/g, '')
      .trim() || 'Arkusz';
  }

  function uniqueName(name, used) {
    let result = name;
    let number = 2;
    while (used.has(result.toLocaleLowerCase())) {
      result = name + '_' + number++;
    }
    used.add(result.toLocaleLowerCase());
    return result;
  }

  function renderPreview() {
    if (!workbook) return;
    const used = new Set();
    const rows = workbook.worksheets.map(sheet => {
      const name = uniqueName(cleanName(sheet.name + suffixInput.value), used);
      return '<li><span>' + escapeHtml(sheet.name) + '</span><span class="filename">' +
        escapeHtml(name + '.xlsx') + '</span></li>';
    }).join('');
    status.innerHTML = '<strong>Liczba arkuszy: ' + workbook.worksheets.length +
      '</strong><ul>' + rows + '</ul>';
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[char]);
  }

  async function loadFile(file) {
    if (!file) return;
    if (!/\.xlsx$/i.test(file.name)) {
      status.textContent = 'Wybierz plik Excel w formacie XLSX.';
      return;
    }
    runButton.disabled = true;
    workbook = null;
    status.textContent = 'Wczytywanie pliku…';
    fileName.textContent = file.name;
    try {
      const data = await file.arrayBuffer();
      const parsed = new ExcelJS.Workbook();
      await parsed.xlsx.load(data);
      if (!parsed.worksheets || parsed.worksheets.length === 0) {
        throw new Error('Plik nie zawiera żadnych arkuszy.');
      }
      workbook = parsed;
      sourceName = file.name.replace(/\.[^.]+$/, '');
      runButton.disabled = false;
      renderPreview();
    } catch (error) {
      status.textContent = 'Nie udało się odczytać pliku: ' + error.message;
      fileName.textContent = 'Nie wybrano pliku.';
    }
  }

  fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));
  suffixInput.addEventListener('input', renderPreview);

  ['dragenter', 'dragover'].forEach(eventName => {
    document.addEventListener(eventName, event => {
      event.preventDefault();
      if (eventName === 'dragover' && event.target && drop.contains(event.target)) {
        drop.classList.add('over');
      }
    });
  });
  ['dragleave', 'drop'].forEach(eventName => {
    document.addEventListener(eventName, event => {
      event.preventDefault();
      drop.classList.remove('over');
    });
  });
  document.addEventListener('drop', event => {
    const file = event.dataTransfer && event.dataTransfer.files &&
      event.dataTransfer.files.length ? event.dataTransfer.files[0] : null;
    if (file) loadFile(file);
  });

  runButton.addEventListener('click', async () => {
    if (!workbook) return;
    runButton.disabled = true;
    status.textContent = 'Tworzenie plików XLSX i paczki ZIP…';
    try {
      const zip = new JSZip();
      const used = new Set();
      for (let index = 0; index < workbook.worksheets.length; index++) {
        const sourceSheet = workbook.worksheets[index];
        const outputName = uniqueName(cleanName(sourceSheet.name + suffixInput.value), used);
        const outputBook = new ExcelJS.Workbook();

        // Copy the complete worksheet model first: dimensions, merges, views,
        // page setup, conditional formatting and other worksheet-level settings.
        const targetSheet = outputBook.addWorksheet(sourceSheet.name);
        targetSheet.model = JSON.parse(JSON.stringify(sourceSheet.model));
        targetSheet.name = sourceSheet.name;

        // Copy cell values and styles explicitly. ExcelJS worksheet-model cloning
        // alone does not reliably carry every cell style into another workbook.
        sourceSheet.eachRow({includeEmpty:true}, (sourceRow, rowNumber) => {
          const targetRow = targetSheet.getRow(rowNumber);
          targetRow.height = sourceRow.height;
          targetRow.hidden = sourceRow.hidden;
          targetRow.outlineLevel = sourceRow.outlineLevel;
          targetRow.collapsed = sourceRow.collapsed;
          targetRow.style = JSON.parse(JSON.stringify(sourceRow.style || {}));

          sourceRow.eachCell({includeEmpty:true}, (sourceCell, columnNumber) => {
            const targetCell = targetRow.getCell(columnNumber);
            targetCell.value = sourceCell.value;
            targetCell.style = JSON.parse(JSON.stringify(sourceCell.style || {}));
            if (sourceCell.note) targetCell.note = sourceCell.note;
          });
        });

        // Preserve column widths, visibility and column-level styles.
        sourceSheet.columns.forEach((sourceColumn, index) => {
          const targetColumn = targetSheet.getColumn(index + 1);
          if (sourceColumn.width !== undefined) targetColumn.width = sourceColumn.width;
          targetColumn.hidden = sourceColumn.hidden;
          targetColumn.outlineLevel = sourceColumn.outlineLevel;
          targetColumn.style = JSON.parse(JSON.stringify(sourceColumn.style || {}));
        });

        // Reapply merged ranges after the cell data/style copy.
        (sourceSheet.model.merges || []).forEach(range => {
          try { targetSheet.mergeCells(range); } catch (_) {}
        });

        // Keep worksheet-level options that are exposed by ExcelJS.
        targetSheet.properties = JSON.parse(JSON.stringify(sourceSheet.properties || {}));
        targetSheet.pageSetup = JSON.parse(JSON.stringify(sourceSheet.pageSetup || {}));
        targetSheet.headerFooter = JSON.parse(JSON.stringify(sourceSheet.headerFooter || {}));
        targetSheet.views = JSON.parse(JSON.stringify(sourceSheet.views || []));
        if (sourceSheet.autoFilter) {
          targetSheet.autoFilter = JSON.parse(JSON.stringify(sourceSheet.autoFilter));
        }
        if (sourceSheet.dataValidations) {
          targetSheet.dataValidations = JSON.parse(JSON.stringify(sourceSheet.dataValidations));
        }
        if (sourceSheet.conditionalFormattings) {
          targetSheet.conditionalFormattings = JSON.parse(JSON.stringify(sourceSheet.conditionalFormattings));
        }

        const bytes = await outputBook.xlsx.writeBuffer();
        zip.file(outputName + '.xlsx', bytes);
        status.textContent = 'Przetworzono arkuszy: ' + (index + 1) +
          ' z ' + workbook.worksheets.length;
      }
      const blob = await zip.generateAsync({
        type:'blob', compression:'DEFLATE', compressionOptions:{level:6}
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = cleanName(sourceName) + '_podzielony.zip';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      status.textContent = 'Gotowe. Utworzono ' + workbook.worksheets.length +
        ' osobnych plików XLSX w paczce ZIP.';
    } catch (error) {
      status.textContent = 'Błąd podczas tworzenia paczki: ' + error.message;
    } finally {
      runButton.disabled = false;
    }
  });
})();
</script>
</body>
</html>

name: Inspect XLSX packages
on:
  push:
    paths:
      - "inspect-trigger.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check application JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          start=html.index("<script>")+len("<script>")
          end=html.index("</script>",start)
          Path("/tmp/app.js").write_text(html[start:end],encoding="utf-8")
          PY
          node --check /tmp/app.js
      - name: Test XLSX cleanup against uploaded generated file
        run: |
          npm install --no-save jszip @xmldom/xmldom
          cat > /tmp/test-cleanup.cjs <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const JSZip = require('jszip');
          const { DOMParser, XMLSerializer } = require('@xmldom/xmldom');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('  const PACKAGE_REL_NS');
          const end = html.indexOf('  runButton.addEventListener', start);
          if (start < 0 || end < 0) throw new Error('Nie znaleziono funkcji czyszczenia XLSX.');
          const context = { DOMParser, XMLSerializer, console };
          vm.createContext(context);
          vm.runInContext(html.slice(start, end) + String.fromCharCode(10) + 'globalThis.runClean = cleanWorkbookPackage;', context);
          (async () => {
            const zip = await JSZip.loadAsync(fs.readFileSync('test-files/wygenerowany.xlsx'));
            const workbookDoc = new DOMParser().parseFromString(await zip.file('xl/workbook.xml').async('string'), 'application/xml');
            const sheet = workbookDoc.getElementsByTagNameNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main', 'sheet')[0];
            await context.runClean(zip, sheet.getAttribute('name'), workbookDoc);
            zip.file('xl/workbook.xml', new XMLSerializer().serializeToString(workbookDoc));
            fs.writeFileSync('/tmp/cleaned.xlsx', await zip.generateAsync({type:'nodebuffer'}));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/test-cleanup.cjs
          python - <<'PY'
          import zipfile, xml.etree.ElementTree as ET, posixpath
          p='/tmp/cleaned.xlsx'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert z.testzip() is None, 'ZIP CRC error'
              sheets=[n for n in names if n.startswith('xl/worksheets/sheet') and n.endswith('.xml') and '/_rels/' not in n]
              assert len(sheets)==1, f'Expected 1 worksheet part, found {len(sheets)}: {sheets}'
              assert 'xl/calcChain.xml' not in names, 'Stale calcChain remains'
              for n in names:
                  if n.endswith('.xml') or n.endswith('.rels'):
                      ET.fromstring(z.read(n))
              for relfile in [n for n in names if n.endswith('.rels')]:
                  parent, leaf=posixpath.split(relfile)
                  source_dir=posixpath.dirname(parent)
                  source=posixpath.join(source_dir,leaf[:-5])
                  base=posixpath.dirname(source)
                  root=ET.fromstring(z.read(relfile))
                  for rel in root:
                      target=rel.attrib.get('Target','')
                      if rel.attrib.get('TargetMode')=='External' or not target: continue
                      resolved=posixpath.normpath(posixpath.join(base,target))
                      assert resolved in names, f'Missing relationship target: {relfile} -> {resolved}'
              root=ET.fromstring(z.read('[Content_Types].xml'))
              for item in root:
                  part=item.attrib.get('PartName','').lstrip('/')
                  assert not part or part in names, f'Missing content type part: {part}'
              print('PASS: one worksheet, no calcChain, valid XML, all relationships and content types resolve.')
              print('Remaining package parts:',len(names))
          PY
      - name: Compare XLSX package structure
        run: |
          python - <<'PY'
          import zipfile, xml.etree.ElementTree as ET, posixpath, difflib
          from pathlib import Path
          files={"original":Path("test-files/oryginal.xlsx"),"generated":Path("test-files/wygenerowany.xlsx")}
          packages={}
          for name,path in files.items():
              print(f"\\n===== {name.upper()} {path.stat().st_size} bytes =====")
              with zipfile.ZipFile(path) as z:
                  bad=z.testzip(); names=set(z.namelist()); data={n:z.read(n) for n in names}
              packages[name]=(names,data)
              print("ZIP:", "OK" if bad is None else "BAD "+bad, "PARTS:",len(names))
              print("PARTS:",*sorted(names),sep="\\n  ")
              missing=[]
              for relfile in sorted(n for n in names if n.endswith(".rels")):
                  # /a/_rels/b.xml.rels describes relationships from /a/b.xml
                  parent, leaf=posixpath.split(relfile)
                  source_dir=posixpath.dirname(parent)
                  source_name=leaf[:-5] if leaf.endswith(".rels") else leaf
                  base=posixpath.join(source_dir,source_name)
                  base=posixpath.dirname(base)
                  try: root=ET.fromstring(data[relfile])
                  except Exception as e:
                      print("INVALID RELS XML",relfile,repr(e)); continue
                  for rel in root:
                      target=rel.attrib.get("Target","")
                      if rel.attrib.get("TargetMode")=="External" or not target: continue
                      resolved=posixpath.normpath(posixpath.join(base,target))
                      if resolved not in names: missing.append((relfile,target,resolved,rel.attrib.get("Type")))
              print("MISSING RELATIONSHIP TARGETS:",len(missing))
              for item in missing: print("  ",item)
              ct=ET.fromstring(data["[Content_Types].xml"])
              missing_ct=[e.attrib.get("PartName") for e in ct if e.attrib.get("PartName") and e.attrib["PartName"].lstrip("/") not in names]
              print("MISSING CONTENT-TYPE PARTS:",missing_ct)
              xml_errors=[]
              for n in sorted(x for x in names if x.endswith(".xml") or x.endswith(".rels")):
                  try: ET.fromstring(data[n])
                  except Exception as e: xml_errors.append((n,repr(e)))
              print("XML PARSE ERRORS:",xml_errors)
              if "xl/calcChain.xml" in data:
                  print("CALCCHAIN:",data["xl/calcChain.xml"].decode("utf-8","replace")[:5000])
              if "docProps/app.xml" in data:
                  print("APP XML:",data["docProps/app.xml"].decode("utf-8","replace")[:5000])
              for n in sorted(x for x in names if x.startswith("xl/worksheets/sheet") and x.endswith(".xml") and not "/_rels/" in x):
                  print("WORKSHEET SIZE",n,len(data[n]),"START",repr(data[n][:120]))
              for n in ("_rels/.rels","xl/workbook.xml","xl/_rels/workbook.xml.rels","xl/worksheets/sheet22.xml","xl/worksheets/_rels/sheet22.xml.rels"):
                  if n in data:
                      print(f"\\n--- {n} ---")
                      print(data[n].decode("utf-8","replace")[:12000])
          an,ad=packages["original"]; bn,bd=packages["generated"]
          print("\\n===== PART SET DIFFERENCE =====")
          print("ONLY ORIGINAL:",*sorted(an-bn),sep="\\n  ")
          print("ONLY GENERATED:",*sorted(bn-an),sep="\\n  ")
          for n in ("_rels/.rels","xl/workbook.xml","xl/_rels/workbook.xml.rels","[Content_Types].xml"):
              if n in ad and n in bd:
                  aa=ad[n].decode("utf-8","replace").splitlines(); bb=bd[n].decode("utf-8","replace").splitlines()
                  diff=list(difflib.unified_diff(aa,bb,fromfile="original/"+n,tofile="generated/"+n,lineterm=""))
                  print(f"\\n--- DIFF {n} ---")
                  print("\\n".join(diff[:100]) if diff else "NO DIFFERENCE")
          PY
